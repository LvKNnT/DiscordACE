<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KingVietnamese settings</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="settings">
      <h1>KingVietnamese</h1>
      <p>Show answer candidates in Discord Web.</p>
      <label class="toggle-row" for="helper-enabled">
        <span>Helper</span>
        <input id="helper-enabled" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
      </label>
      <div id="status" role="status"></div>
    </main>
  </body>
</html>
